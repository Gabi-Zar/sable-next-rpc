appId: moe.sable.next.electron
productName: Sable Electron
copyright: Copyright © SableClient contributors

directories:
  output: release

files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json
  - '!node_modules/**/*'
asarUnpack:
  - dist/*.node
extraResources:
  - from: ../dist
    to: dist
    filter:
      - '**/*'
      - '!**/*.map'
      - '!**/sable_wasm_bg-*.wasm'
  - from: ../src-tauri/icons/icon.png
    to: sable-tray.png
  - from: ../src-tauri/icons/icon.ico
    to: sable-tray.ico

npmRebuild: false
afterPack: ./after-pack.mjs
# Generate metadata here; CI uploads it to Forgejo.
publish:
  provider: generic
  url: https://git.sable.moe/SableClient/sable-next/releases/download/${channel}

electronLanguages:
  - bg
  - cs
  - de
  - en
  - en_GB
  - es
  - es_419
  - fr
  - it
  - nl
  - pl
  - pt_BR
  - pt_PT
  - ro
  - th
  - tr
  - uk

mac:
  artifactName: sable-electron-${version}-${arch}.${ext}
  category: public.app-category.social-networking
  icon: ../src-tauri/icons/icon.icns
  minimumSystemVersion: '12.0'
  target:
    - dmg
    - zip
  # Not '-': 26.15.3 signs with any keychain certificate whose name has a dash.
  identity: null
  hardenedRuntime: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Sable needs camera access for video calls, photos and videos.
    NSMicrophoneUsageDescription: Sable needs microphone access for calls and videos.
    NSAudioCaptureUsageDescription: Sable captures system audio when sharing your screen with sound.
    NSLocalNetworkUsageDescription: Sable connects to homeservers and call servers on your local network.
dmg:
  background: ../src-tauri/icons/installer/dmg-background.png

win:
  artifactName: sable-electron-${version}-${arch}.${ext}
  icon: ../src-tauri/icons/icon.ico
  target:
    - nsis
    - msi
nsis:
  oneClick: false
  installerIcon: ../src-tauri/icons/icon.ico
  uninstallerIcon: ../src-tauri/icons/icon.ico
  installerHeader: ../src-tauri/icons/installer/nsis-header.bmp
  installerSidebar: ../src-tauri/icons/installer/nsis-sidebar.bmp

linux:
  maintainer: SableClient
  artifactName: sable-electron-${version}-${arch}.${ext}
  executableName: sable
  syncDesktopName: true
  icon: ../src-tauri/icons/icon.png
  category: Network;InstantMessaging
  target:
    - deb
    - rpm
    - AppImage
    - tar.gz

deb:
  packageName: sable-electron
rpm:
  packageName: sable-electron
