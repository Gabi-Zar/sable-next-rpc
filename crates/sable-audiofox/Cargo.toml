[package]
name = "sable-audiofox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
sable-loopback = { path = "../sable-loopback", version = "0.1.0", features = ["audiofox"] }
napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"

[build-dependencies]
napi-build = "2.6.0"

[lints]
workspace = true
