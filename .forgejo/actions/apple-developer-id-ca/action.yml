name: Apple Developer ID intermediate
description: Gives codesign the Developer ID G2 intermediate, which the imported .p12 lacks.

runs:
  using: composite
  steps:
    - name: Install the intermediate
      shell: bash
      env:
        CERT_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
      run: |
        cert="$RUNNER_TEMP/DeveloperIDG2CA.cer"
        curl -fsSL --retry 3 -o "$cert" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
        echo "$CERT_SHA256  $cert" | shasum -a 256 -c -
        keychain="$HOME/Library/Keychains/apple-ca.keychain-db"
        [ -f "$keychain" ] || security create-keychain -p '' "$keychain"
        security unlock-keychain -p '' "$keychain"
        security find-certificate -c 'Developer ID Certification Authority' "$keychain" >/dev/null 2>&1 \
          || security import "$cert" -k "$keychain"
        existing="$(security list-keychains -d user | tr -d '" ')"
        case "$existing" in
          *"$keychain"*) ;;
          *) security list-keychains -d user -s "$keychain" $existing ;;
        esac
