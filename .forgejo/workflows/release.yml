name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to tag and release. Empty uses the branch head.'
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: Create release
    if: ${{ github.event_name == 'workflow_dispatch' || (github.head_ref == 'release' && github.event.pull_request.merged == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag points at the commit the release pull request merged into.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release preparation
        # Knope creates a release even without a changelog and knows nothing
        # about the Android changelogs.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -n "$TITLE" ] && [ "${TITLE##* }" != "$version" ]; then
            echo "::error::$TITLE does not match package.json ($version)"
            exit 1
          fi
          node scripts/release/release-prep.mjs "$version"

      - name: Create release
        run: node scripts/release/forgejo-release-pr.mjs release
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
