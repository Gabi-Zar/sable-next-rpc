packages:
  - .
  - electron

hoistPattern:
  - '*'
  - '!electron'

allowBuilds:
  '@sentry/cli': true
  '@vencord/venmic': false
  cpu-features: false
  electron: true
  electron-winstaller: false
  esbuild: true
  lightningcss: true
  protobufjs: false
  ssh2: false
  workerd: true
minimumReleaseAge: 1440
patchedDependencies:
  svelte@5.57.1: patches/svelte@5.57.1.patch
