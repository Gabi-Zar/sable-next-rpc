packages:
  - .
  - electron

hoistPattern:
  - '*'
  - '!electron'

allowBuilds:
  '@sentry/cli': true
  '@vencord/venmic': false
  cpu-features: false
  electron: true
  electron-winstaller: false
  esbuild: true
  lightningcss: true
  protobufjs: false
  ssh2: false
  workerd: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sableclient/*'
  - electron@45.0.0
patchedDependencies:
  '@sveltejs/kit@3.0.1': patches/@sveltejs__kit@3.0.1.patch
  livekit-client@2.22.4: patches/livekit-client@2.22.4.patch
  svelte@5.57.2: patches/svelte@5.57.2.patch
