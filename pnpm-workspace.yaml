packages:
  - .
  - electron

hoistPattern:
  - '*'
  - '!electron'

allowBuilds:
  '@sentry/cli': true
  '@vencord/venmic': false
  cpu-features: false
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: true
  lightningcss: true
  protobufjs: false
  ssh2: false
  workerd: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@sableclient/*'
  - electron@45.0.0
patchedDependencies:
  '@sveltejs/kit@3.1.0': patches/@sveltejs__kit@3.1.0.patch
  livekit-client@2.23.0: patches/livekit-client@2.23.0.patch
  # Backport https://github.com/benjamn/recast/pull/1442 until it is released.
  recast@0.23.21: patches/recast@0.23.21.patch
  svelte@5.57.2: patches/svelte@5.57.2.patch
