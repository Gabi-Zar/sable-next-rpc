[package]
edition = "2018"
name = "bytecount"
version = "0.6.9"
authors = [
    "Andre Bogus <bogusandre@gmail.de>",
    "Joshua Landau <joshua@landau.ws>",
]
build = false
exclude = [
    "/.travis.yml",
    "/appveyor.yml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "count occurrences of a given byte, or the number of UTF-8 code points, in a byte slice, fast"
readme = "README.md"
categories = [
    "algorithms",
    "no-std",
]
license = "Apache-2.0/MIT"
repository = "https://github.com/llogiq/bytecount"

[badges.appveyor]
repository = "llogiq/bytecount"

[badges.travis-ci]
repository = "llogiq/bytecount"

[features]
generic-simd = []
html_report = []
runtime-dispatch-simd = []

[lib]
name = "bytecount"
path = "src/lib.rs"
bench = false

