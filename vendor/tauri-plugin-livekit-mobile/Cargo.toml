[package]
name = "tauri-plugin-livekit-mobile"
version = "0.2.0"
authors = [ "Sable Contributors" ]
description = "Native LiveKit audio-room bridge for Tauri mobile apps (Android/iOS): the room runs natively, owned and coordinated from Rust."
license = "AGPL-3.0-only"
repository = "https://github.com/SableClient/tauri-plugin-livekit-mobile"
homepage = "https://github.com/SableClient/tauri-plugin-livekit-mobile"
documentation = "https://github.com/SableClient/tauri-plugin-livekit-mobile"
edition = "2021"
rust-version = "1.85"
exclude = ["/examples"]
links = "tauri-plugin-livekit-mobile"

[dependencies]
tauri = { version = "2.11.3", default-features = false }
base64 = "0.22"
serde = "1.0"
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[dev-dependencies]
serde_json = "1.0"
tauri = { version = "2.11.3", default-features = false, features = ["test"] }
