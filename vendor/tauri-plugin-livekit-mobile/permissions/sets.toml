# Least-privilege alternatives to `default`.
#
# `default` stays broad on purpose: it is the identifier host capability files
# already reference, and Tauri resolves a capability's `permissions` list as
# the privileges it grants, so narrowing `default` would silently revoke
# commands from every app that lists it. A host that wants least privilege
# lists these sets *instead of* `livekit-mobile:default`.
#
# `native-room` is the base: it carries the capability probe and the room
# lifecycle. The other sets are strictly additive feature grants.

[[set]]
identifier = "native-room"
description = "Capability probe plus the native LiveKit room lifecycle: connect, disconnect, state, microphone, camera and shared-E2EE keys. The base set every host needs."
permissions = [
    "allow-get-native-call-capabilities",
    "allow-connect-native-call",
    "allow-disconnect-native-call",
    "allow-get-native-call-state",
    "allow-set-native-call-microphone-enabled",
    "allow-set-native-call-camera-enabled",
    "allow-set-native-call-audio-processing",
    "allow-set-native-call-participant-volume",
    "allow-switch-native-call-camera",
    "allow-set-native-call-encryption-key",
]

[[set]]
identifier = "video-overlays"
description = "Positioning the natively rendered remote and local video views over the webview. Needed only by a host that reports tile geometry."
permissions = [
    "allow-set-native-call-remote-video-overlay",
    "allow-clear-native-call-remote-video-overlay",
    "allow-set-native-call-local-video-overlay",
    "allow-clear-native-call-local-video-overlay",
]

[[set]]
identifier = "screen-share"
description = "Publishing a local screen-share track."
permissions = ["allow-set-native-call-screen-share-enabled"]

[[set]]
identifier = "picture-in-picture"
description = "Arming picture in picture for the call, so the system may enter it when the user leaves the app."
permissions = ["allow-set-native-call-pip-enabled"]

[[set]]
identifier = "system-calls"
description = "Registering the call with the operating system's call UI (CallKit on iOS, Telecom on Android) and answering the actions it reports back."
permissions = [
    "allow-start-system-call",
    "allow-report-incoming-call",
    "allow-end-system-call",
    "allow-set-system-call-muted",
    "allow-drain-pending-system-call-actions",
    "allow-fulfill-answer-call",
    "allow-fulfill-end-call",
    "allow-report-system-call-connected",
    "allow-update-call-display",
]

[[set]]
identifier = "audio-routes"
description = "Listing and selecting the call's audio output route."
permissions = ["allow-get-audio-routes", "allow-set-audio-route"]
